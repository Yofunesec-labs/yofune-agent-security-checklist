target:
  schema_version: "1.0"
  name: Anthropic Messages Agent
  version: "application-version"
  model: "${ANTHROPIC_MODEL}"
  policy_version: "policy-version"
  agent:
    type: anthropic-messages
    model: "${ANTHROPIC_MODEL}"
    api_key: "${ANTHROPIC_API_KEY}"
    system: "You are the target agent under authorized YASC security verification."
    max_tokens: 1024
    tools: []
    timeout_seconds: 60
