  - Repeat with a benign control case to separate security behavior from ordinary failure.
  expected_result: New protected actions fail after the defined containment point.
  evidence:
  - test case/payload reference
  - trace ID
  - policy decision
  - relevant tool/service logs
  - final outcome
  controls:
  - YAS-03.05
  - YAS-09.04
  - YAS-10.04
  safety:
  - Use synthetic or non-production data unless the test plan explicitly authorizes otherwise.
  - Do not target third-party systems without written authorization.
